name: bola_verse
description: "BolaVersa Admin - Football Prediction and League Administration Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Switzer
      fonts:
        - asset: assets/fonts/Switzer-Variable.ttf
        - asset: assets/fonts/Switzer-VariableItalic.ttf
          style: italic

  assets:
    - assets/images/
    - assets/jerseys/
    - assets/flags/
